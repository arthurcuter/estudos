<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
</head>

<body>
    <!-- value: valor atual -->
    <!-- max: valor máximo -->
    <progress value="20" max="100"></progress>
</body>
<!-- usamos progress para exibir uma barra de progesso. no exemplo, veremos uma barra 20% completa -->


<meter min="0" max="10" low="3" high="7" optimum="9" value="0">
</meter>

<meter min="0" max="10" low="3" high="7" optimum="9" value="1">
</meter>

<meter min="0" max="10" low="3" high="7" optimum="9" value="4">
</meter>

<meter min="0" max="10" low="3" high="7" optimum="9" value="7">
</meter>

<meter min="0" max="10" low="3" high="7" optimum="9" value="10">
</meter>

<!-- o elemento meter, por outro lado, mostra uma barra de progresso dentro de um intervalo definido
nele, definimos min (valor minimo), max (valor maximo), low (valor considerado baixo), high (valor considerado alto),
optimum (valor considerado otimo), e value (valor atual). o meter exibe a barra de progresso com cores, variando 
entre vermelho, amarelo e verde dependendo do estado da barra -->

</html>
