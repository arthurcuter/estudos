<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>Tabelas</title>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>nome</th>
                <th>nome de novo</th>
                <th>mais nome ainda pq é top</th>
                <th>nome ebaaa</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Arthur</td>
                <td>Arthur de novo</td>
                <td>mais arthur ainda pq ele é top</td>
                <td> arthur ebaaa</td>
            </tr>

            <tr>
                <td>tutu</td>
                <td>tutuzinho</td>
                <td>tutuzao</td>
                <td>tutuzasso</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
            </tr>
        </tfoot>
    </table>
    <!-- elemento table usado para criar uma tabela, que pode ser aninhado com o elemento tr, que serve para criar 
    uma linha da tabela (tr = table row), esse que pode ser aninhado com o elemento <td>, table data, que é um
    dado daquela linha. cada dado q vc por, é uma nova coluna, mas tudo na mesma linha se tiver aninhado no
    mesmo tr -->
    <!-- usamos th (table header) para criar o cabeçalho da tabela -->
    <!-- usamos thead e tbody para melhorar a legibilidade do documento, sendo que thead define o 
      cabeçalho da tabela, e tbody o corpo -->
      <!-- usamos tambem o tfoot para representar o rodape da tabela -->
</body>

</html>
