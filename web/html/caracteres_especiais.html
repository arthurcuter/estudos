<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Caracteres especiais</title>
    <meta charset="utf-8">
  </head>
  <body>
    <p>Um "e comercial": &amp;</p>
    <p>Um símbolo de menor: &lt;</p>
    <p>Um símbolo de maior: &gt;</p>
    <p>Raiz quadrada: &#8730;</p>
    <p>Portanto: &there4;</p>
    <p>Copyright: &copy;</p>
    <p>Marca registrada comercial: &reg;</p>
  </body>
  <!-- existem simbolos que nao conseguimos digitar. para usa-los, usamos sequencias especiais
   previstas na especificacao do html, com alguns exemplos acima -->
   <!-- podemos ver todas em: https://html.spec.whatwg.org/multipage/named-characters.html#named-character-references -->
</html>
