<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <title>Página incial</title>
    </head>
    <body>
        <h1>Página inicial</h1>
        <p>
            Você está na página inicial. Veja uma <a href="nomes.html">página com nomes de pessoas.</a> 
            <!-- elemento a sendo utilizado para associar um link entre arquivos. primeiro vc usa o atributo href
             para sinalizar qual arquivo é, e dps o texto que sera um texto clicavel que leva ate o link/documento -->
        </p>
        <img src="imagens/papagaio.jpg" width="300" alt="Um papagaio com cenário verde atrás">
        <!-- elemento img parta adicionar uma imagem, atributo src para especificar onde esta a imagem (pode ser local 
         ou remoto), e atributo alt para dar uma descricao a foto, que sera utilizado caso a imagem nao seja carregada ou
         para ferramentas de acessibilidade lerem a imagem -->
         <!-- nota-se que o elemento img não tem tag de fechamento, isso pois ele não pode ser aninhado, ele apenas
          utiliza seus proprios atributos e acabou -->
        <!-- tambem podemos usar width ou height para especificar o tamanho da imagem. podemos tanto usar os dois atributos,
         especificando examente largura e altura da imagem, ou usar apenas um, dessa forma o outro atributo nao colocado
         sera ajustado de forma proporcional-->
         <img src="https://images.pexels.com/photos/16228442/pexels-photo-16228442.jpeg" width="134" alt="Um macaquinho bonitinho">
    </body>
</html>
