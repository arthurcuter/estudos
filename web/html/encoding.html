<!DOCTYPE html> 
<!-- especificar a versao do html -->

<html lang="pt-BR">
    <!-- tag html, para especificar raiz do html -->
    <!-- atributo  lang, usado para especificar a linguagem da pagina, util para ferramentas de acessibilidade 
    funcionarem de forma mais correta (tipos aquelas que leem a pagina). se vc colocar o atributo em uma lingua e escrever
    a pagina em outra, a pagina ainda é exibida, mas prejudica ferramentas que precisam identificar a linguagem-->
  <head>
    <!-- tag head para metadados, que não necessariamente serão vistos pelo usuario -->
    <title>Encoding</title>
    <!-- titulo da pagina, aquele que fica na abinha la em cima -->
    <meta charset="utf-8">
    <!-- especificando o encoding da pagina -->
    <!-- encoding é o programa que transforma o conteudo de um arquivo em binario. a forma como o conteudo é traduzido
     para 0s e 1s varia de um encoding para outro, por isso pode ser bom especificar, apesar dos navegadores modernos identificarem  
     charset é um ATRIBUTO da tag meta, e seu conteudo é utf-8 -->
  </head>
  <body>
    <!-- tag body para especificar o corpo da pagina -->
    <p>Ação</p>
    <!-- tag p para identificar um paragrafo -->
  </body>
</html>
