<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Cursos</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- usamos o elemento link para acessar o conteudo que foi definido no arquivo .css
   o atributo rel vem de relationship, e atribuimos o valor "stylesheet" para definir o tipo de relacao
   entre os arquivos. por fim, o href diz onde esta o arquivo -->
</head>
<body>
  <h1 id="titulo">Portal de cursos</h1>
  <p id="descricao">Temos cursos nas mais diversas áreas.</p>
  <p class="nova promocao">Venha conversar conosco e conhecer nossas ofertas de <strong>bolsas de estudos</strong>.</p>
  <!-- elemento strong do html é usado para indicar coisas importantes. os navegadores deixam
   esse conteudo em negrito. a diferença dele para o elemnto <b>, é q o strong tambem sinaliza
    aos navegadores e ferramentas de acessibilidade do que aquilo se trata (algo importante) -->
    <!-- podemos usar "class" para definir classes para elementos, que usaremos futuramente no .css.
     as classes definem a categoria q um elemento se encaixa -->
     <!-- voce pode por quantas classes quiser, basta separar por espaço em branco -->
  <p class="novo-curso">Ciência da Computação</p>
  <p class="curso">Engenharia de Computação</p>
  <p class="curso">Farmácia</p>
  <p id="contato "class="final-pagina">Entre em contato: 11223344</p>
  <p id="rodape" class="final-pagina">&copy; Todos os direitos reservados</p>
</body>
</html>
